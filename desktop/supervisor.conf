
[program:hotdesk-computer]
command=/usr/local/bin/start-computer.sh
user=cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1"
autorestart=true
priority=30

[program:hotdesk-browser]
stopwaitsecs=15
command=/usr/local/bin/start-browser.sh
user=cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1"
autorestart=true
priority=40

[program:hotdesk-playwright]
command=/usr/local/bin/node /usr/local/lib/node_modules/@playwright/mcp/cli.js --cdp-endpoint http://127.0.0.1:9222 --host 127.0.0.1 --port 8931 --snapshot-mode none --allowed-hosts *
user=cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1"
autorestart=true
priority=50


[program:hotdesk-gateway]
command=/opt/venv/bin/python3 /usr/local/bin/hotdesk-gateway.py
user=cua
autorestart=true
priority=60
